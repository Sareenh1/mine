<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #fff1f5 0%, #ffffff 60%);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ff2d55, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 6px 24px rgba(255, 45, 85, 0.25);
    }

    #message {
      font-size: 1.5rem;
      margin-bottom: 20px;
      height: 44px;
      font-weight: 600;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    button {
      padding: 16px 36px;
      font-size: 1.2rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff2d55, #9333ea);
      color: white;
      box-shadow: 0 14px 30px rgba(147, 51, 234, 0.35);
    }

    #yesBtn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 18px 36px rgba(255, 45, 85, 0.45);
    }

    #noBtn {
      background: linear-gradient(135deg, #e5e7eb, #cbd5f5);
      color: #334155;
    }

    /* Floating hearts (pure CSS shapes, no emoji) */
    .heart {
      position: absolute;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, #ff6aa2, #ff9acb);
      transform: rotate(45deg);
      animation: float 8s infinite ease-in;
      opacity: 0.7;
      filter: drop-shadow(0 4px 10px rgba(255, 106, 162, 0.35));
    }

    .heart::before,
    .heart::after {
      content: '';
      width: 18px;
      height: 18px;
      background: inherit;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before { top: -9px; left: 0; }
    .heart::after  { left: -9px; top: 0; }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine?</h1>
  <div id="message"></div>

  <div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const message = document.getElementById('message');

    let scale = 1;
    let messageIndex = 0;

    const messages = [
      "I prayed for someone like you, and here you are🙏❤️",
      "You are my favorite blessing💖",
      "I promise I’ll choose you today and always💍",
      "You feel like home to me🏠❤️",
      "I don’t want perfect. I want you❤️",
      "My heart chose you long before my mind understood❤️✨",
      "Every time you smile, my heart forgets how to behave❤️",
      "With you, even silence feels beautiful❤️",
      "You make ordinary days feel like miracles❤️"
    ];

    const colors = ["#ff2d55", "#7c3aed", "#f43f5e", "#ec4899", "#fb7185", "#c026d3"];

    noBtn.addEventListener('click', () => {
      scale *= 1.2;
      yesBtn.style.transform = `scale(${scale})`;

      message.textContent = messages[messageIndex % messages.length];
      message.style.color = colors[messageIndex % colors.length];
      message.style.transform = "scale(1.05)";
      setTimeout(() => message.style.transform = "scale(1)", 150);

      messageIndex++;
    });

    yesBtn.addEventListener('click', () => {
      document.body.innerHTML = `
        <h1 style="
          background: linear-gradient(135deg, #ff2d55, #7c3aed);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          font-size: 3.2rem;">
          YAYYY!!❤️
        </h1>

    <p style="font-size: 1.6rem; color: #ff2d55; line-height: 1.6;">
      You just made my day Bokku Mundi ❤️✨<br><br>

      You are my blessing from the Lord 🙏.  
      <strong>(Proverbs 18:22)</strong><br><br>

      With God ✝ at the center, our love will stand strong💕.  
      <strong>(Ecclesiastes 4:12)</strong>
    </p>
      `;
    });

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = 5 + Math.random() * 5 + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }

    setInterval(createHeart, 450);
  </script>

</body>
</html>
